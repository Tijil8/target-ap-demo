spring:
  application:
    name: vendor-payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ap
    username: ap
    password: ap
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ap-payment-processor
      auto-offset-reset: earliest
    producer:
      properties:
        spring.json.add.type.headers: false

ap:
  topics:
    invoices-received: invoices.received
    payments-settled: payments.settled
    payments-failed: payments.failed

# Incident triage: "mock" (default, no API key, fully offline) or "claude" (real Anthropic call).
# Activate the real analyzer with:  --spring.profiles.active=claude  (needs ANTHROPIC_API_KEY)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
